<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SP500 Profit/Loss Calculator</title>
    <style>
      body {
        background: #f4f4f9;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .calculator {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
      }
      .calculator h2 {
        text-align: center;
        color: #333;
      }
      .calculator input,
      .calculator select {
        width: calc(100% - 20px);
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      .calculator button {
        width: 100%;
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }
      .calculator button:hover {
        background: #0056b3;
      }
      .result {
        text-align: center;
        font-size: 1.2em;
        margin-top: 15px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <h2>SP500 Profit/Loss Calculator</h2>
      <input type="number" id="entryPrice" placeholder="Entry Price" />
      <input type="number" id="exitPrice" placeholder="Exit Price" />
      <input type="number" id="lotSize" placeholder="Lot Size" />
      <select id="tradeType">
        <option value="buy">Buy</option>
        <option value="sell">Sell</option>
      </select>
      <button onclick="calculatePnL()">Calculate</button>
      <div class="result" id="result"></div>
    </div>

    <script>
      function calculatePnL() {
        const entryPrice = parseFloat(
          document.getElementById("entryPrice").value
        );
        const exitPrice = parseFloat(
          document.getElementById("exitPrice").value
        );
        const lotSize = parseFloat(document.getElementById("lotSize").value);
        const tradeType = document.getElementById("tradeType").value;
        const pointValue = 100 * lotSize;

        if (
          isNaN(entryPrice) ||
          isNaN(exitPrice) ||
          isNaN(lotSize) ||
          lotSize <= 0
        ) {
          alert("Please enter valid numbers");
          return;
        }

        let priceDifference = 0;

        if (tradeType === "buy") {
          priceDifference = exitPrice - entryPrice;
        } else if (tradeType === "sell") {
          priceDifference = entryPrice - exitPrice;
        }

        const pnl = priceDifference * pointValue;

        document.getElementById("result").innerText = `P&L: ${pnl.toFixed(
          2
        )} USD`;
      }
    </script>
  </body>
</html>
